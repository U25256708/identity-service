databaseChangeLog:

  - changeSet:
      id: 004-create-user-roles
      author: identity-service

      changes:

        - createTable:
            schemaName: identity_schema
            tableName: user_roles

            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_user_roles

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false


        - addUniqueConstraint:
            schemaName: identity_schema
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: uq_user_roles_user_role


        - addForeignKeyConstraint:
            baseTableSchemaName: identity_schema
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableSchemaName: identity_schema
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user


        - addForeignKeyConstraint:
            baseTableSchemaName: identity_schema
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableSchemaName: identity_schema
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role


        - createIndex:
            schemaName: identity_schema
            tableName: user_roles
            indexName: ix_user_roles_role_id

            columns:
              - column:
                  name: role_id