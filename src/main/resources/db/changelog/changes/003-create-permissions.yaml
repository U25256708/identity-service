databaseChangeLog:

  - changeSet:
      id: 003-create-permissions
      author: identity-service

      changes:

        - createTable:
            schemaName: identity_schema
            tableName: permissions

            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_permissions

              - column:
                  name: code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(36)

              - column:
                  name: updated_by
                  type: VARCHAR(36)

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false


        - addUniqueConstraint:
            schemaName: identity_schema
            tableName: permissions
            columnNames: code
            constraintName: uq_permissions_code


        - sql:
            sql: |
              ALTER TABLE identity_schema.permissions
              ADD CONSTRAINT ck_permissions_code_format
              CHECK (code ~ '^[A-Z][A-Z0-9_]*$');