databaseChangeLog:

  - changeSet:
      id: 006-create-otp-credentials
      author: identity-service

      changes:

        - createTable:
            schemaName: identity_schema
            tableName: otp_credentials

            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_otp_credentials

              - column:
                  name: user_id
                  type: UUID

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: code_hash
                  type: VARCHAR(255)

              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: valid_until
                  type: TIMESTAMPTZ
                  defaultValueComputed: "(CURRENT_TIMESTAMP + INTERVAL '8 minutes')"
                  constraints:
                    nullable: false

              - column:
                  name: validated_at
                  type: TIMESTAMPTZ

              - column:
                  name: is_validated
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableSchemaName: identity_schema
            baseTableName: otp_credentials
            baseColumnNames: user_id
            referencedTableSchemaName: identity_schema
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_otp_credentials_user


        - sql:
            sql: |
              ALTER TABLE identity_schema.otp_credentials
              ADD CONSTRAINT ck_otp_email_not_blank
              CHECK (BTRIM(email) <> '');

              ALTER TABLE identity_schema.otp_credentials
              ADD CONSTRAINT ck_otp_attempts
              CHECK (attempts BETWEEN 0 AND 3);

              ALTER TABLE identity_schema.otp_credentials
              ADD CONSTRAINT ck_otp_valid_until
              CHECK (valid_until > created_at);

              ALTER TABLE identity_schema.otp_credentials
              ADD CONSTRAINT ck_otp_validation_state
              CHECK (
                  (
                      is_validated = FALSE
                      AND code_hash IS NOT NULL
                      AND NULLIF(BTRIM(code_hash), '') IS NOT NULL
                      AND validated_at IS NULL
                  )
                  OR
                  (
                      is_validated = TRUE
                      AND code_hash IS NULL
                      AND validated_at IS NOT NULL
                      AND user_id IS NOT NULL
                      AND attempts < 3
                      AND validated_at <= valid_until
                  )
              );


        - sql:
            sql: |
              CREATE INDEX ix_otp_credentials_pending_email
              ON identity_schema.otp_credentials (LOWER(email), valid_until)
              WHERE is_validated = FALSE;

              CREATE INDEX ix_otp_credentials_user_id
              ON identity_schema.otp_credentials (user_id)
              WHERE user_id IS NOT NULL;

              CREATE INDEX ix_otp_credentials_cleanup
              ON identity_schema.otp_credentials (valid_until)
              WHERE is_validated = FALSE;